<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predict Math Score</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --input: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    }

    h1 {
      margin: 0 0 4px;
    }

    p {
      color: var(--muted);
      margin: 0 0 24px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    select,
    input {
      width: 100%;
      padding: 10px 12px;
      background: var(--input);
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      grid-column: 1 / -1;
      padding: 12px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .result {
      margin-top: 24px;
      padding: 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      text-align: center;
      font-size: 1.2rem;
    }

    .result strong {
      color: var(--accent);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Predict Math Score</h1>
      <p>Enter student details to estimate the math score.</p>
      <form action="/predict" method="post">
        <div>
          <label>Gender</label>
          <select name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div>
          <label>Race / Ethnicity</label>
          <select name="race_ethnicity" required>
            <option value="group A">Group A</option>
            <option value="group B">Group B</option>
            <option value="group C">Group C</option>
            <option value="group D">Group D</option>
            <option value="group E">Group E</option>
          </select>
        </div>
        <div>
          <label>Parental Level of Education</label>
          <select name="parental_level_of_education" required>
            <option value="some high school">Some High School</option>
            <option value="high school">High School</option>
            <option value="some college">Some College</option>
            <option value="associate's degree">Associate's Degree</option>
            <option value="bachelor's degree">Bachelor's Degree</option>
            <option value="master's degree">Master's Degree</option>
          </select>
        </div>
        <div>
          <label>Lunch</label>
          <select name="lunch" required>
            <option value="standard">Standard</option>
            <option value="free/reduced">Free / Reduced</option>
          </select>
        </div>
        <div>
          <label>Test Preparation Course</label>
          <select name="test_preparation_course" required>
            <option value="none">None</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div>
          <label>Reading Score</label>
          <input type="number" name="reading_score" min="0" max="100" required />
        </div>
        <div>
          <label>Writing Score</label>
          <input type="number" name="writing_score" min="0" max="100" required />
        </div>
        <button type="submit">Predict</button>
      </form>
      {% if result is defined %}
      <div class="result">Predicted Math Score: <strong>{{ result[0]|round(2) }}</strong></div>
      {% endif %}
      <p style="margin-top:16px;"><a href="/">Back to home</a></p>
    </div>
  </div>
</body>

</html>
