<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Performance Predictor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.9rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      background: var(--accent);
      color: #0f172a;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .btn:hover {
      opacity: .9;
    }

    .meta {
      margin-top: 32px;
      font-size: .85rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Student Performance Predictor</h1>
    <p>Predict a student's math score from demographic and academic inputs using a trained machine-learning model.</p>
    <a class="btn" href="/predict">Start Prediction</a>
    <div class="meta">End-to-end ML pipeline · Flask · scikit-learn</div>
  </div>
</body>

</html>
